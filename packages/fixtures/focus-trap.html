<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Finish Line controlled fixture</title><style>body{font:18px Arial;margin:32px;background:#eff3f8;color:#182c4b}button,a,[role=button]{padding:14px;margin:8px;min-height:44px}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:4px solid #2359d9}#result{padding:20px} .product{padding:24px;background:white;max-width:500px}</style><body><h1>Controlled browser fixture</h1><section role="dialog" aria-label="Trapped dialog"><button id="a">First trapped control</button><button id="b">Second trapped control</button></section><button id="target" onclick="act()">Add to cart</button><p id="result" role="status">Nothing added yet</p><script>function act(){document.querySelector('#result').textContent='Added to cart '+Date.now()}document.querySelector('#a').focus();document.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();document.querySelector(document.activeElement.id==='a'?'#b':'#a').focus()}})</script></body></html>
